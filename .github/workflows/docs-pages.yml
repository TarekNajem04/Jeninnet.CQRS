name: Docs Pages

# Deploys the documentation site to GitHub Pages on every main-branch change
# that can affect the site. Manual runs remain available for a dry run.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/docs-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:

    name: Build site

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK (global.json)
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Jeninnet.CQRS.slnx

      - name: Generate API metadata
        run: dotnet docfx metadata docs/docfx.json

      - name: Build site
        run: dotnet docfx build docs/docfx.json --warningsAsErrors

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/_site

  deploy:

    name: Deploy to GitHub Pages

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
